<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SPPFS — Frontend</title>

    <!-- React CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/index-CxK8DFs6.css') }}"
    />

    {% if current_user.is_authenticated %}
    <script>
      window.FACULTY_NAME = "{{ current_user.username|e }}";
      window.FACULTY_BRANCH = "{{ current_user.branch or '' }}";
    </script>
    {% endif %}
  </head>

  <body>
    <div id="root"></div>

    <!-- Main React bundle -->
    <script
      type="module"
      src="{{ url_for('static', filename='assets/index.es-DLov8eGc.js') }}"
    ></script>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const pin = params.get("pin");
    if (!pin) return; // no ?pin=... -> nothing to auto-search

    function tryAutoSearch() {
      // 1) find the PIN input and Search button rendered by React
      const input = document.querySelector('input[placeholder^="Enter PIN"]');
      const buttons = Array.from(document.querySelectorAll("button"));
      const searchBtn = buttons.find(
        (b) => b.textContent.trim().toLowerCase() === "search"
      );

      if (!input || !searchBtn) {
        // React not ready yet, try again on next interval tick
        return;
      }

      console.log("Auto-search: filling PIN", pin);

      // 2) Use the native value setter so React's controlled input sees the change
      const nativeSetter = Object.getOwnPropertyDescriptor(
        window.HTMLInputElement.prototype,
        "value"
      ).set;
      nativeSetter.call(input, pin);

      // 3) Fire an 'input' event so React's onChange handler runs and updates state
      const ev = new Event("input", { bubbles: true });
      input.dispatchEvent(ev);

      // 4) Click the Search button (React onClick will now use updated state)
      searchBtn.click();

      clearInterval(intervalId);
    }

    // keep trying until React has mounted (max ~8 seconds)
    const intervalId = setInterval(tryAutoSearch, 250);
    setTimeout(() => clearInterval(intervalId), 8000);
  })();
</script>



  </body>
</html>
