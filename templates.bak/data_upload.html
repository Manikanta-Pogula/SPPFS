<!-- templates/data_upload.html -->
{% extends "base.html" %}
{% block title %}Data Upload{% endblock %}

{% block content %}
<div style="background:#0b6cf6;color:#fff;padding:18px;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div><h3>Welcome back, {{ current_user.username if current_user else 'Faculty' }}</h3></div>
    <div style="text-align:right;">
      <div>{{ current_user.username if current_user else '' }}</div>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-light">Logout</a>
    </div>
  </div>
</div>

<div class="container" style="padding:16px;">
  <h4>Data Upload</h4>
  <form id="upload-form" enctype="multipart/form-data">
    <label>Exam Type:
      <select id="exam_type" name="exam_type">
        <option value="mid1">Mid-1</option>
        <option value="mid2">Mid-2</option>
        <option value="semester">Semester (End Exam)</option>
      </select>
    </label>

    <label>Semester:
      <select id="semester" name="semester">
        {% for s in range(1,9) %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </label>

    <label>Class Year:
      <select id="year" name="year">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>

    <label>File Label:
      <input type="text" id="file_label" name="file_label" placeholder="e.g., 4th Sem - Mid-1">
    </label>

    <label>Choose file:
      <input type="file" id="file" name="file" accept=".csv,.xlsx">
    </label>

    <button id="btn-preview" class="btn btn-primary" type="submit">Preview</button>
    <a class="btn" href="{{ url_for('static', filename='sample_csv/sample_mid1.csv') }}" download>Download sample CSV</a>
  </form>

  <div id="status" style="margin-top:12px;font-weight:600;"></div>

  <div id="preview-area" style="display:none;margin-top:12px;">
    <div style="margin-bottom:8px;">
      <button id="toggle-edit" class="btn">Edit</button>
      <button id="btn-commit" class="btn btn-success">Commit to DB</button>
    </div>
    <div id="preview-table" style="max-height:480px;overflow:auto;border:1px solid #ddd;padding:8px;"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/data_upload.js') }}"></script>
{% endblock %}
